<!DOCTYPE html>
<html>
<head>
    <title>TerrainRF Analytics - Dynamic Viewshed & P2P</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body, html { height: 100%; margin: 0; padding: 0; font-family: sans-serif; }
        #map { width: 100%; height: 100vh; }
        #controls {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            width: 240px;
        }
        .control-group { margin-bottom: 10px; }
        .control-group label { display: block; font-weight: bold; font-size: 13px; margin-bottom: 3px; }
        .control-group input, .control-group select { width: 100%; padding: 5px; box-sizing: border-box; }
        
        /* Modal Popup Styling for Profile Graph */
        #profileModal {
            display: none; position: absolute; bottom: 20px; left: 20px; right: 20px; max-width: 800px;
            margin: 0 auto; background: white; z-index: 2000; padding: 15px; border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        #profileModal h4 { margin: 0 0 10px 0; font-size: 15px; display: flex; justify-content: space-between; align-items: center; }
        #closeModal { cursor: pointer; background: #ddd; border: none; padding: 2px 8px; border-radius: 4px; font-weight: bold; }
    </style>
</head>
<body>
    <div id="controls">
        <h3>TerrainRF Analytics</h3>
        
        <div class="control-group">
            <label>Analysis Mode:</label>
            <select id="analysisMode">
                <option value="viewshed">360° Viewshed</option>
                <option value="p2p">Point-to-Point Link</option>
            </select>
        </div>

        <div class="control-group" id="heightGroup1">
            <label id="labelHeight1">Observer Height (m):</label>
            <input type="number" id="obsHeight" value="2.0">
        </div>

        <div class="control-group" id="heightGroup2" style="display: none;">
            <label>Receiver Height (m):</label>
            <input type="number" id="obsHeight2" value="2.0">
        </div>

        <div class="control-group" id="p2pActionGroup" style="display: none;">
            <button id="rerunBtn" style="padding: 6px; cursor: pointer; width: 100%; background: #007bff; color: white; border: none; border-radius: 4px; font-weight: bold; margin-bottom: 5px;">Re-run P2P Link</button>
            <button id="clearP2PBtn" style="padding: 5px; cursor: pointer; width: 100%; background: #6c757d; color: white; border: none; border-radius: 4px;">Reset Points</button>
        </div>

        <div class="control-group">
            <label>Search Location:</label>
            <input type="text" id="searchQuery" placeholder="City, Zip, or Lat,Lon">
            <button id="searchBtn" style="padding: 5px 8px; margin-top: 5px; cursor: pointer; width: 100%;">Go</button>
        </div>
        
        <div id="p2pInstructions" style="font-size: 12px; color: #555; margin-top: 5px; display: none;">
            <b>P2P Mode:</b> Click Map for Point A (Tower), then click for Point B (Receiver).
        </div>
    </div>

    <!-- Side Profile Graph Modal -->
    <div id="profileModal">
        <h4>
            <span id="modalTitle">Path Elevation Profile</span>
            <button id="closeModal">X</button>
        </h4>
        <div style="height: 200px;">
            <canvas id="profileChart"></canvas>
        </div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>
    <script>
        var map = L.map('map').setView([32.88, -116.85], 12);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        var currentMarker = null;
        var currentOverlay = null;
        
        var p2pPoint1 = null;
        var p2pPoint2 = null;
        var p2pMarker1 = null;
        var p2pMarker2 = null;
        var p2pLine = null;
        var profileChartInstance = null;

        document.getElementById('analysisMode').addEventListener('change', function(e) {
            var mode = e.target.value;
            resetMapLayers();
            document.getElementById('profileModal').style.display = 'none';
            if (mode === 'p2p') {
                document.getElementById('heightGroup1').querySelector('label').innerText = 'Tower Height A (m):';
                document.getElementById('heightGroup2').style.display = 'block';
                document.getElementById('p2pActionGroup').style.display = 'block';
                document.getElementById('p2pInstructions').style.display = 'block';
            } else {
                document.getElementById('heightGroup1').querySelector('label').innerText = 'Observer Height (m):';
                document.getElementById('heightGroup2').style.display = 'none';
                document.getElementById('p2pActionGroup').style.display = 'none';
                document.getElementById('p2pInstructions').style.display = 'none';
            }
        });

        document.getElementById('closeModal').addEventListener('click', function() {
            document.getElementById('profileModal').style.display = 'none';
        });

        document.getElementById('clearP2PBtn').addEventListener('click', function() {
            resetMapLayers();
            alert("P2P points cleared. Click map to set Point A.");
        });

        document.getElementById('rerunBtn').addEventListener('click', function() {
            if (!p2pPoint1 || !p2pPoint2) {
                alert("Please select both Point A and Point B on the map first.");
                return;
            }
            executeP2PAnalysis();
        });

        function resetMapLayers() {
            if (currentMarker) { map.removeLayer(currentMarker); currentMarker = null; }
            if (currentOverlay) { map.removeLayer(currentOverlay); currentOverlay = null; }
            if (p2pMarker1) { map.removeLayer(p2pMarker1); p2pMarker1 = null; }
            if (p2pMarker2) { map.removeLayer(p2pMarker2); p2pMarker2 = null; }
            if (p2pLine) { map.removeLayer(p2pLine); p2pLine = null; }
            p2pPoint1 = null;
            p2pPoint2 = null;
            document.getElementById('profileModal').style.display = 'none';
        }

        document.getElementById('searchBtn').addEventListener('click', performSearch);
        document.getElementById('searchQuery').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') performSearch();
        });

        function performSearch() {
            var query = document.getElementById('searchQuery').value.trim();
            if (!query) return;

            var coordMatch = query.match(/^(-?\d+\.?\d*),\s*(-?\d+\.?\d*)$/);
            if (coordMatch) {
                var lat = parseFloat(coordMatch[1]);
                var lon = parseFloat(coordMatch[2]);
                map.setView([lat, lon], 13);
                return;
            }

            fetch('https://nominatim.openstreetmap.org/search?format=json&q=' + encodeURIComponent(query))
                .then(response => response.json())
                .then(data => {
                    if (data && data.length > 0) {
                        var lat = parseFloat(data[0].lat);
                        var lon = parseFloat(data[0].lon);
                        map.setView([lat, lon], 12);
                    } else {
                        alert("Location not found.");
                    }
                })
                .catch(err => {
                    console.error("Search error:", err);
                    alert("Error searching location.");
                });
        }

        map.on('click', function(e) {
            var lat = e.latlng.lat;
            var lon = e.latlng.lng;
            var mode = document.getElementById('analysisMode').value;

            if (mode === 'viewshed') {
                var height = document.getElementById('obsHeight').value;
                resetMapLayers();

                currentMarker = L.marker([lat, lon]).addTo(map).bindPopup("Calculating viewshed...").openPopup();

                fetch('/compute', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ lat: lat, lon: lon, height: height })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        currentOverlay = L.imageOverlay(data.overlay_url, data.bounds, { opacity: 0.7 }).addTo(map);
                        currentMarker.bindPopup("<b>Observer Point</b><br>Lat: " + lat.toFixed(4) + "<br>Lon: " + lon.toFixed(4)).openPopup();
                    } else {
                        alert("Server Error: " + data.error);
                        currentMarker.bindPopup("Error: " + data.error).openPopup();
                    }
                })
                .catch(err => {
                    console.error("Fetch error:", err);
                    alert("Error: " + err.message);
                });

            } else {
                if (!p2pPoint1 || p2pPoint2) {
                    if (p2pMarker1) { map.removeLayer(p2pMarker1); p2pMarker1 = null; }
                    if (p2pMarker2) { map.removeLayer(p2pMarker2); p2pMarker2 = null; }
                    if (p2pLine) { map.removeLayer(p2pLine); p2pLine = null; }
                    document.getElementById('profileModal').style.display = 'none';

                    p2pPoint1 = { lat: lat, lon: lon };
                    p2pPoint2 = null;
                    p2pMarker1 = L.marker([lat, lon]).addTo(map).bindPopup("Point A (Tower)").openPopup();
                    document.getElementById('p2pInstructions').innerText = "Point A set! Now click map for Point B (Receiver).";
                } else {
                    p2pPoint2 = { lat: lat, lon: lon };
                    p2pMarker2 = L.marker([lat, lon]).addTo(map).bindPopup("Point B (Receiver)").openPopup();
                    document.getElementById('p2pInstructions').innerText = "Both points set! Adjust heights and click 'Re-run P2P Link' anytime.";
                    
                    executeP2PAnalysis();
                }
            }
        });

        function executeP2PAnalysis() {
            if (!p2pPoint1 || !p2pPoint2) return;

            var h1 = document.getElementById('obsHeight').value;
            var h2 = document.getElementById('obsHeight2').value;

            fetch('/compute-p2p', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    lat1: p2pPoint1.lat, lon1: p2pPoint1.lon, h1: h1,
                    lat2: p2pPoint2.lat, lon2: p2pPoint2.lon, h2: h2
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    var lineColor = data.clear ? 'green' : 'red';
                    var statusText = data.clear ? "<b>Link Clear!</b>" : "<b>Link Blocked!</b> (Max obstruction: " + data.max_obstruction_m.toFixed(1) + "m)";
                    
                    if (p2pLine) { map.removeLayer(p2pLine); }
                    p2pLine = L.polyline(data.path, { color: lineColor, weight: 4 }).addTo(map);
                    
                    if (p2pMarker2) {
                        p2pMarker2.bindPopup(statusText).openPopup();
                    }

                    renderProfileChart(data.chart_data, data.clear, data.max_obstruction_m);
                } else {
                    alert("Server Error: " + data.error);
                }
            })
            .catch(err => {
                console.error("P2P fetch error:", err);
                alert("Error: " + err.message);
            });
        }

        function renderProfileChart(chartData, isClear, maxObs) {
            document.getElementById('profileModal').style.display = 'block';
            var titleText = isClear ? "Path Elevation Profile — LINK CLEAR" : "Path Elevation Profile — BLOCKED (Max Obstruction: " + maxObs.toFixed(1) + "m)";
            document.getElementById('modalTitle').innerText = titleText;

            var ctx = document.getElementById('profileChart').getContext('2d');
            if (profileChartInstance) {
                profileChartInstance.destroy();
            }

            profileChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: chartData.distances,
                    datasets: [
                        {
                            label: 'Ground Elevation (m)',
                            data: chartData.ground,
                            borderColor: 'rgba(100, 100, 100, 1)',
                            backgroundColor: 'rgba(150, 150, 150, 0.2)',
                            fill: true,
                            pointRadius: 0,
                            borderWidth: 2
                        },
                        {
                            label: 'Line-of-Sight Path (m)',
                            data: chartData.los,
                            borderColor: isClear ? 'rgba(0, 200, 0, 1)' : 'rgba(200, 0, 0, 1)',
                            borderDash: [5, 5],
                            pointRadius: 0,
                            borderWidth: 2,
                            fill: false
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: {
                            title: { display: true, text: 'Distance (miles)' }
                        },
                        y: {
                            title: { display: true, text: 'Elevation (meters)' }
                        }
                    }
                }
            });
        }
    </script>
</body>
</html>
