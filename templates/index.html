<!DOCTYPE html>
<html>
<head>
    <title>TerrainRF Analytics - Dynamic Viewshed</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="[https://unpkg.com/leaflet@1.9.3/dist/leaflet.css](https://unpkg.com/leaflet@1.9.3/dist/leaflet.css)" />
    <style>
        body, html { height: 100%; margin: 0; padding: 0; font-family: sans-serif; }
        #map { width: 100%; height: 100vh; }
        #controls {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 15px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <div id="controls">
        <h3>TerrainRF Analytics</h3>
        <p>Click anywhere on the map to calculate viewshed.</p>
        <label>Observer Height (m):</label><br>
        <input type="number" id="obsHeight" value="2.0" style="width: 100px; padding: 5px; margin-top: 5px;"><br>
        <label style="margin-top: 10px; display: inline-block;">Search Location:</label><br>
        <input type="text" id="searchQuery" placeholder="City, Zip, or Lat,Lon" style="width: 160px; padding: 5px; margin-top: 5px;">
        <button id="searchBtn" style="padding: 5px 8px; margin-top: 5px; cursor: pointer;">Go</button>
    </div>
    <div id="map"></div>

    <script src="[https://unpkg.com/leaflet@1.9.3/dist/leaflet.js](https://unpkg.com/leaflet@1.9.3/dist/leaflet.js)"></script>
    <script>
        var map = L.map('map').setView([32.88, -116.85], 12);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        var currentMarker = null;
        var currentOverlay = null;

        // Search functionality
        document.getElementById('searchBtn').addEventListener('click', performSearch);
        document.getElementById('searchQuery').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') performSearch();
        });

        function performSearch() {
            var query = document.getElementById('searchQuery').value.trim();
            if (!query) return;

            var coordMatch = query.match(/^(-?\d+\.?\d*),\s*(-?\d+\.?\d*)$/);
            if (coordMatch) {
                var lat = parseFloat(coordMatch[1]);
                var lon = parseFloat(coordMatch[2]);
                map.setView([lat, lon], 13);
                return;
            }

            fetch('[https://nominatim.openstreetmap.org/search?format=json&q=](https://nominatim.openstreetmap.org/search?format=json&q=)' + encodeURIComponent(query))
                .then(response => response.json())
                .then(data => {
                    if (data && data.length > 0) {
                        var lat = parseFloat(data[0].lat);
                        var lon = parseFloat(data[0].lon);
                        map.setView([lat, lon], 12);
                    } else {
                        alert("Location not found.");
                    }
                })
                .catch(err => {
                    console.error("Search error:", err);
                    alert("Error searching location.");
                });
        }

        map.on('click', function(e) {
            var lat = e.latlng.lat;
            var lon = e.latlng.lng;
            var height = document.getElementById('obsHeight').value;

            if (currentMarker) map.removeLayer(currentMarker);
            if (currentOverlay) map.removeLayer(currentOverlay);

            currentMarker = L.marker([lat, lon]).addTo(map).bindPopup("Calculating viewshed...").openPopup();

            fetch('/compute', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ lat: lat, lon: lon, height: height })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    currentOverlay = L.imageOverlay(data.overlay_url, data.bounds, { opacity: 0.7 }).addTo(map);
                    currentMarker.bindPopup("<b>Observer Point</b><br>Lat: " + lat.toFixed(4) + "<br>Lon: " + lon.toFixed(4)).openPopup();
                } else {
                    alert("Server Error: " + data.error);
                    currentMarker.bindPopup("Error: " + data.error).openPopup();
                }
            })
            .catch(err => {
                console.error("Fetch error:", err);
                alert("Error: " + err.message);
            });
        });
    </script>
</body>
</html>
